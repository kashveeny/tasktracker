<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>task.log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101215;
    --surface:#181b1f;
    --surface-2:#1f2329;
    --surface-3:#262b32;
    --border:#2a2e35;
    --text:#e9e7e2;
    --text-dim:#8b9099;
    --text-faint:#565b63;
    --accent-purple:#a879ff;
    --danger:#ff6b6b;
    --radius:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(168,121,255,0.08), transparent 60%),
      linear-gradient(var(--border) 1px, transparent 1px) 0 0/100% 34px,
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent-purple);outline-offset:2px;}
  ::selection{background:var(--accent-purple);color:#160c26;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

  #app{
    display:grid;
    grid-template-columns:240px 1fr;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    overflow-y:auto;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.01em;
    padding:4px 8px 22px 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand::before{
    content:'>';
    color:var(--accent-purple);
    font-family:var(--font-mono);
  }
  .brand::after{
    content:'';
    width:8px;height:16px;
    background:var(--accent-purple);
    animation:blink 1.1s step-end infinite;
    margin-left:1px;
  }
  @keyframes blink{ 50%{opacity:0;} }
  @media (prefers-reduced-motion: reduce){ .brand::after{animation:none;opacity:1;} }
  .cat-list{display:flex;flex-direction:column;gap:2px;flex:1;}
  .cat-tab{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--text-dim);
    padding:10px 10px;
    border-radius:0 6px 6px 0;
    font-size:14px;
    text-align:left;
    position:relative;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .cat-tab .dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 0 3px transparent;
    transition:box-shadow .15s ease;
  }
  .cat-tab .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .cat-tab .count{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
  }
  .cat-tab:hover{background:var(--surface-2);color:var(--text);}
  .cat-tab.active{
    background:var(--surface-2);
    color:var(--text);
    border-left-color:var(--cat-color, var(--accent-purple));
  }
  .cat-tab.active .dot{ box-shadow:0 0 0 3px color-mix(in srgb, var(--cat-color, var(--accent-purple)) 25%, transparent); }
  .cat-tab .del-cat{
    display:none;
    background:none;border:none;color:var(--text-faint);
    font-size:14px;padding:2px 4px;
  }
  .cat-tab:hover .del-cat{display:inline-block;}
  .cat-tab .del-cat:hover{color:var(--danger);}

  .add-cat-row{margin-top:10px;}
  .add-cat-btn{
    width:100%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-faint);
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    text-align:left;
  }
  .add-cat-btn:hover{border-color:var(--text-faint);color:var(--text-dim);}
  .add-cat-form{display:flex;gap:6px;margin-top:4px;}
  .add-cat-form input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:7px 8px;font-size:13px;
  }
  .add-cat-form button{
    background:var(--accent-purple);color:#160c26;border:none;
    border-radius:6px;padding:0 10px;font-size:13px;font-weight:600;
  }

  .sidebar-foot{
    padding-top:14px;margin-top:8px;border-top:1px solid var(--border);
    font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
  }

  /* ---------- Board ---------- */
  .board{
    display:flex;flex-direction:column;
    overflow:hidden;
    padding:28px 36px 0 36px;
  }
  .board-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .board-header h1{
    font-family:var(--font-display);
    font-size:24px;
    margin:0;
    display:flex;align-items:center;gap:10px;
  }
  .board-header h1 .dot{width:10px;height:10px;border-radius:50%;}
  .add-task-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    display:flex;align-items:center;gap:6px;
    transition:border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .add-task-btn:hover{
    border-color:var(--accent-purple);
    color:var(--accent-purple);
    box-shadow:0 0 0 3px rgba(168,121,255,0.12);
  }

  .board-scroll{flex:1;overflow-y:auto;padding-bottom:24px;}

  .empty-state{
    color:var(--text-faint);
    font-family:var(--font-mono);
    font-size:12.5px;
    padding:44px 20px;
    border:1px dashed var(--border);
    border-radius:var(--radius);
    text-align:center;
    line-height:1.6;
  }
  .empty-state .glyph{display:block;font-size:20px;margin-bottom:8px;color:var(--text-faint);}

  .task-row{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--cat-color, var(--border));
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:8px;
    transition:transform .15s ease, opacity .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .task-row:hover{
    background:var(--surface-2);
    cursor:pointer;
    transform:translateX(2px);
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .task-row.punching{transform:scale(0.98);opacity:0.5;}

  .checkbox{
    width:19px;height:19px;border-radius:5px;
    border:1.5px solid var(--text-faint);
    flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease;
  }
  .checkbox:hover{border-color:var(--accent-purple);}
  .checkbox.checked{background:var(--accent-purple);border-color:var(--accent-purple);transform:scale(1.08);}
  .checkbox svg{width:12px;height:12px;display:none;}
  .checkbox.checked svg{display:block;}

  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14.5px;font-weight:500;line-height:1.4;}
  .task-notes-preview{
    font-size:12.5px;color:var(--text-dim);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .task-meta{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    margin-top:5px;
  }

  .done-drawer{margin-top:18px;border-top:1px solid var(--border);padding-top:10px;}
  .done-toggle{
    background:none;border:none;color:var(--text-faint);
    font-family:var(--font-mono);font-size:12px;
    display:flex;align-items:center;gap:6px;padding:6px 2px;
  }
  .done-toggle:hover{color:var(--text-dim);}
  .done-toggle .chev{transition:transform .15s ease;display:inline-block;}
  .done-toggle.open .chev{transform:rotate(90deg);}
  .done-list{margin-top:8px;}
  .task-row.done{opacity:0.55;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--text-dim);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,9,11,0.65);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;width:100%;max-width:460px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    animation:modalIn .18s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes modalIn{ from{opacity:0;transform:translateY(6px) scale(0.98);} to{opacity:1;transform:none;} }
  .modal h3{margin:0 0 14px 0;font-family:var(--font-display);font-size:17px;display:flex;align-items:center;gap:8px;}
  .modal h3::before{content:'//';color:var(--accent-purple);font-family:var(--font-mono);font-size:14px;}
  .field-label{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;display:block;
  }
  .modal input[type=text], .modal textarea, .modal select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:10px 11px;font-size:14px;
    margin-bottom:14px;resize:vertical;
  }
  .modal textarea{min-height:90px;line-height:1.5;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--accent-purple);color:#160c26;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger-text{background:none;border:none;color:var(--text-faint);font-size:12.5px;}
  .btn-danger-text:hover{color:var(--danger);}

  /* ---------- Agent dock ---------- */
  .agent-dock{position:fixed;bottom:22px;right:26px;z-index:40;}
  .agent-fab{
    background:var(--accent-purple);color:#160c26;border:none;
    border-radius:24px;padding:12px 18px;font-weight:600;font-size:13.5px;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
  }
  .agent-fab::before{content:'●';font-size:9px;}
  .agent-panel{
    position:fixed;bottom:22px;right:26px;
    width:360px;max-width:calc(100vw - 32px);
    height:480px;max-height:calc(100vh - 100px);
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
    overflow:hidden;
    animation:panelIn .18s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes panelIn{ from{opacity:0;transform:translateY(10px) scale(0.97);} to{opacity:1;transform:none;} }
  .agent-head{
    display:flex;align-items:center;gap:8px;
    padding:12px 14px;border-bottom:1px solid var(--border);
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    background:var(--surface-2);
  }
  .agent-head .dots{display:flex;gap:5px;margin-right:4px;}
  .agent-head .dots span{width:8px;height:8px;border-radius:50%;}
  .agent-head .dots span:nth-child(1){background:#ff6b6b;}
  .agent-head .dots span:nth-child(2){background:#f6c453;}
  .agent-head .dots span:nth-child(3){background:var(--accent-purple);}
  .agent-head .label{flex:1;}
  .agent-head .close-btn{background:none;border:none;color:var(--text-faint);font-size:16px;}
  .agent-head .close-btn:hover{color:var(--text);}
  .agent-messages{
    flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
    font-size:13px;
  }
  .msg{max-width:88%;padding:9px 11px;border-radius:9px;line-height:1.45;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--surface-3);color:var(--text);}
  .msg.agent{
    align-self:flex-start;background:var(--surface-2);color:var(--text);
    font-family:var(--font-mono);font-size:12.5px;border-left:2px solid var(--accent-purple);
  }
  .msg.agent::before{content:'agent$ ';color:var(--accent-purple);}
  .msg.error{border-left-color:var(--danger);}
  .msg.error::before{color:var(--danger);}
  .msg.thinking{color:var(--text-faint);font-family:var(--font-mono);font-size:12.5px;}
  .msg.thinking::after{content:'';animation:dots 1.2s steps(4) infinite;}
  @keyframes dots{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
  @media (prefers-reduced-motion: reduce){ .msg.thinking::after{animation:none;content:'...';} }
  .agent-form{display:flex;border-top:1px solid var(--border);padding:10px;gap:8px;}
  .agent-form input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;
  }
  .agent-form button{
    background:var(--accent-purple);color:#160c26;border:none;border-radius:8px;
    padding:0 14px;font-weight:600;font-size:13px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  @media (max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;}
    .sidebar{
      flex-direction:row;overflow-x:auto;overflow-y:hidden;
      padding:12px 12px;align-items:center;border-right:none;border-bottom:1px solid var(--border);
    }
    .brand{padding:4px 12px 4px 4px;}
    .cat-list{flex-direction:row;flex:none;}
    .cat-tab{border-left:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap;}
    .cat-tab.active{border-bottom-color:var(--cat-color,var(--accent-purple));}
    .add-cat-row{margin-top:0;margin-left:6px;}
    .sidebar-foot{display:none;}
    .board{padding:18px 16px 0 16px;}
    .agent-panel{width:calc(100vw - 32px);right:16px;left:16px;}
    .agent-dock{right:16px;bottom:16px;}
  }
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">task.log</div>
    <nav class="cat-list" id="catList"></nav>
    <div class="add-cat-row" id="addCatRow">
      <button class="add-cat-btn" id="addCatBtn">+ new category</button>
    </div>
    <div class="sidebar-foot">saved locally // synced across sessions</div>
  </aside>

  <main class="board">
    <div class="board-header">
      <h1 id="boardTitle"><span class="dot" id="boardDot"></span><span id="boardTitleText"></span></h1>
      <button class="add-task-btn" id="addTaskBtn">+ add task</button>
    </div>
    <div class="board-scroll">
      <div id="activeList"></div>
      <div class="done-drawer">
        <button class="done-toggle" id="doneToggle"><span class="chev">▸</span> done (<span id="doneCount">0</span>)</button>
        <div class="done-list" id="doneList" hidden></div>
      </div>
    </div>
  </main>
</div>

<div class="agent-dock" id="agentDock">
  <button class="agent-fab" id="agentFab">ask agent</button>
  <div class="agent-panel" id="agentPanel" hidden>
    <div class="agent-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span class="label">task.log — agent</span>
      <button class="close-btn" id="agentClose">×</button>
    </div>
    <div class="agent-messages" id="agentMessages">
      <div class="msg agent">ask me about your tasks, or tell me to add/finish one.</div>
    </div>
    <form class="agent-form" id="agentForm">
      <input id="agentInput" type="text" placeholder="e.g. add 'finish CS101 pset' to uni" autocomplete="off">
      <button type="submit">send</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h3 id="modalHeading">New task</h3>
    <label class="field-label">Title</label>
    <input type="text" id="modalTitle" placeholder="What needs doing?">
    <label class="field-label">Notes / details</label>
    <textarea id="modalNotes" placeholder="Links, context, deadlines, anything worth keeping..."></textarea>
    <label class="field-label">Category</label>
    <select id="modalCategory"></select>
    <div class="modal-actions">
      <button class="btn-danger-text" id="modalDelete" hidden>delete task</button>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost" id="modalCancel" type="button" style="margin-right:8px;">cancel</button>
      <button class="btn btn-primary" id="modalSave" type="button">save</button>
    </div>
  </div>
</div>

<script>
(function(){
  const PALETTE = ['#ff8fa3','#7dc4ff','#5eead4','#ffb86b','#f6c453','#a3e635','#c792ea'];
  let state = null;
  let activeCategoryId = null;
  let editingTaskId = null; // null = creating new
  let doneOpen = false;

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

  function defaultState(){
    return {
      categories:[
        {id:'cat_personal', name:'Personal', color:'#ff8fa3'},
        {id:'cat_uni', name:'Uni', color:'#7dc4ff'},
        {id:'cat_side', name:'Side Projects', color:'#5eead4'}
      ],
      tasks:[]
    };
  }

  async function loadState(){
    try{
      const res = await window.storage.get('todo-data', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.categories)) return parsed;
      }
    }catch(e){ /* no data yet */ }
    return defaultState();
  }

  async function saveState(){
    try{ await window.storage.set('todo-data', JSON.stringify(state), false); }
    catch(e){ console.error('save failed', e); }
  }

  function fmtTime(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' +
           d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }

  // ---------- Rendering ----------
  function render(){
    renderSidebar();
    renderBoard();
  }

  function renderSidebar(){
    const list = document.getElementById('catList');
    list.innerHTML = '';
    state.categories.forEach(cat=>{
      const activeCount = state.tasks.filter(t=>t.categoryId===cat.id && !t.done).length;
      const btn = document.createElement('button');
      btn.className = 'cat-tab' + (cat.id===activeCategoryId ? ' active':'');
      btn.style.setProperty('--cat-color', cat.color);
      btn.innerHTML = `<span class="dot" style="background:${cat.color}"></span>
        <span class="name">${escapeHtml(cat.name)}</span>
        <span class="count">${activeCount}</span>
        <button class="del-cat" title="delete category">✕</button>`;
      btn.addEventListener('click', (e)=>{
        if(e.target.classList.contains('del-cat')){
          e.stopPropagation();
          deleteCategory(cat.id);
          return;
        }
        activeCategoryId = cat.id;
        doneOpen = false;
        render();
      });
      list.appendChild(btn);
    });
  }

  function renderBoard(){
    const cat = state.categories.find(c=>c.id===activeCategoryId) || state.categories[0];
    if(!cat) return;
    activeCategoryId = cat.id;
    document.getElementById('boardTitleText').textContent = cat.name;
    document.getElementById('boardDot').style.background = cat.color;

    const active = state.tasks.filter(t=>t.categoryId===cat.id && !t.done)
      .sort((a,b)=> b.createdAt - a.createdAt);
    const done = state.tasks.filter(t=>t.categoryId===cat.id && t.done)
      .sort((a,b)=> (b.completedAt||0) - (a.completedAt||0));

    const activeList = document.getElementById('activeList');
    activeList.innerHTML = '';
    if(active.length===0){
      activeList.innerHTML = '<div class="empty-state"><span class="glyph">◌</span>nothing here yet — hit "+ add task" or ask the agent</div>';
    }else{
      active.forEach(t=> activeList.appendChild(renderTaskRow(t, false)));
    }

    document.getElementById('doneCount').textContent = done.length;
    const doneList = document.getElementById('doneList');
    doneList.innerHTML = '';
    done.forEach(t=> doneList.appendChild(renderTaskRow(t, true)));
    doneList.hidden = !doneOpen;
    document.getElementById('doneToggle').classList.toggle('open', doneOpen);
  }

  function renderTaskRow(t, isDone){
    const row = document.createElement('div');
    row.className = 'task-row' + (isDone ? ' done':'');
    const cat = state.categories.find(c=>c.id===t.categoryId);
    if(cat) row.style.setProperty('--cat-color', cat.color);
    row.innerHTML = `
      <button class="checkbox${isDone?' checked':''}" title="${isDone?'mark not done':'mark done'}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#160c26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="task-body">
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${t.notes ? `<div class="task-notes-preview">${escapeHtml(t.notes)}</div>` : ''}
        <div class="task-meta">${isDone ? '// done ' + fmtTime(t.completedAt) : '// added ' + fmtTime(t.createdAt)}</div>
      </div>
    `;
    row.querySelector('.checkbox').addEventListener('click', (e)=>{
      e.stopPropagation();
      row.classList.add('punching');
      setTimeout(()=>{ toggleDone(t.id); }, 140);
    });
    row.addEventListener('click', ()=> openTaskModal(t.id));
    return row;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  // ---------- Task actions ----------
  function toggleDone(id){
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return;
    t.done = !t.done;
    t.completedAt = t.done ? Date.now() : null;
    saveState();
    render();
  }

  function addTask({categoryId, title, notes}){
    if(!title || !title.trim()) return null;
    const t = {
      id: uid('task'),
      categoryId: categoryId || activeCategoryId,
      title: title.trim(),
      notes: (notes||'').trim(),
      done:false,
      createdAt: Date.now(),
      completedAt: null
    };
    state.tasks.push(t);
    saveState();
    return t;
  }

  function updateTask(id, patch){
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return null;
    Object.assign(t, patch);
    saveState();
    return t;
  }

  function deleteTask(id){
    state.tasks = state.tasks.filter(x=>x.id!==id);
    saveState();
  }

  function findOrCreateCategory(name){
    const existing = state.categories.find(c=> c.name.toLowerCase()===String(name).toLowerCase());
    if(existing) return existing;
    const color = PALETTE[state.categories.length % PALETTE.length];
    const cat = {id: uid('cat'), name: name.trim(), color};
    state.categories.push(cat);
    return cat;
  }

  function deleteCategory(id){
    if(state.categories.length<=1){ alert("you need at least one category."); return; }
    const cat = state.categories.find(c=>c.id===id);
    if(!confirm(`Delete "${cat.name}" and all its tasks?`)) return;
    state.categories = state.categories.filter(c=>c.id!==id);
    state.tasks = state.tasks.filter(t=>t.categoryId!==id);
    if(activeCategoryId===id) activeCategoryId = state.categories[0].id;
    saveState();
    render();
  }

  // ---------- Modal ----------
  function openTaskModal(id){
    editingTaskId = id || null;
    const overlay = document.getElementById('overlay');
    const catSelect = document.getElementById('modalCategory');
    catSelect.innerHTML = state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

    if(id){
      const t = state.tasks.find(x=>x.id===id);
      document.getElementById('modalHeading').textContent = 'Edit task';
      document.getElementById('modalTitle').value = t.title;
      document.getElementById('modalNotes').value = t.notes || '';
      catSelect.value = t.categoryId;
      document.getElementById('modalDelete').hidden = false;
    }else{
      document.getElementById('modalHeading').textContent = 'New task';
      document.getElementById('modalTitle').value = '';
      document.getElementById('modalNotes').value = '';
      catSelect.value = activeCategoryId;
      document.getElementById('modalDelete').hidden = true;
    }
    overlay.hidden = false;
    document.getElementById('modalTitle').focus();
  }

  function closeModal(){
    document.getElementById('overlay').hidden = true;
    editingTaskId = null;
  }

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

  document.getElementById('modalSave').addEventListener('click', ()=>{
    const title = document.getElementById('modalTitle').value.trim();
    const notes = document.getElementById('modalNotes').value.trim();
    const categoryId = document.getElementById('modalCategory').value;
    if(!title) return;
    if(editingTaskId){
      updateTask(editingTaskId, {title, notes, categoryId});
    }else{
      addTask({title, notes, categoryId});
    }
    closeModal();
    render();
  });

  document.getElementById('modalDelete').addEventListener('click', ()=>{
    if(editingTaskId && confirm('Delete this task?')){
      deleteTask(editingTaskId);
      closeModal();
      render();
    }
  });

  document.getElementById('addTaskBtn').addEventListener('click', ()=> openTaskModal(null));

  // ---------- Add category ----------
  const addCatRow = document.getElementById('addCatRow');

  function showAddCatButton(){
    addCatRow.innerHTML = '<button class="add-cat-btn" id="addCatBtn">+ new category</button>';
  }

  function showAddCatForm(){
    addCatRow.innerHTML = `<form class="add-cat-form" id="addCatForm">
      <input type="text" id="newCatName" placeholder="category name" autocomplete="off">
      <button type="submit">add</button>
    </form>`;
    document.getElementById('newCatName').focus();
  }

  addCatRow.addEventListener('click', (e)=>{
    if(e.target.id==='addCatBtn') showAddCatForm();
  });

  addCatRow.addEventListener('submit', (e)=>{
    if(e.target.id!=='addCatForm') return;
    e.preventDefault();
    const name = document.getElementById('newCatName').value.trim();
    if(name){
      const cat = findOrCreateCategory(name);
      activeCategoryId = cat.id;
      saveState();
    }
    showAddCatButton();
    render();
  });

  document.getElementById('doneToggle').addEventListener('click', ()=>{
    doneOpen = !doneOpen;
    render();
  });

  // ---------- Agent ----------
  const agentFab = document.getElementById('agentFab');
  const agentPanel = document.getElementById('agentPanel');
  const agentMessages = document.getElementById('agentMessages');
  const agentForm = document.getElementById('agentForm');
  const agentInput = document.getElementById('agentInput');

  agentFab.addEventListener('click', ()=>{
    agentPanel.hidden = false;
    agentFab.hidden = true;
    agentInput.focus();
  });
  document.getElementById('agentClose').addEventListener('click', ()=>{
    agentPanel.hidden = true;
    agentFab.hidden = false;
  });

  function addMsg(text, cls){
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    agentMessages.appendChild(div);
    agentMessages.scrollTop = agentMessages.scrollHeight;
    return div;
  }

  function buildContext(){
    return {
      categories: state.categories.map(c=>({id:c.id, name:c.name})),
      tasks: state.tasks.map(t=>({
        id:t.id, categoryId:t.categoryId, title:t.title, notes:t.notes, done:t.done
      }))
    };
  }

  const SYSTEM_PROMPT = `You are the assistant embedded in a personal to-do app called task.log.
You will be given the user's current data as JSON (categories and tasks) followed by their message.
Answer questions about their tasks helpfully and concisely, and/or make changes when asked.

Respond with ONLY valid JSON (no markdown fences, no commentary outside the JSON), in exactly this shape:
{"reply": "short, conversational reply to show the user", "actions": [ ...zero or more action objects... ]}

Allowed action objects:
{"type":"add_task","categoryId":"<existing category id, or null>","categoryName":"<name of category if categoryId is null - creates it if it doesn't exist>","title":"...","notes":"..."}
{"type":"complete_task","id":"<existing task id>"}
{"type":"reopen_task","id":"<existing task id>"}
{"type":"update_notes","id":"<existing task id>","notes":"..."}
{"type":"update_title","id":"<existing task id>","title":"..."}
{"type":"delete_task","id":"<existing task id>"}
{"type":"add_category","name":"..."}

Rules:
- Only reference task/category ids that exist in the data you were given.
- If the user asks you to add something and doesn't specify a category, put it in a category that fits, or the most recently relevant one, or ask in "reply" and use an empty actions array.
- If the user asks a question with no requested change, return "actions": [].
- Keep "reply" short (1-3 sentences), plain language, no markdown formatting.`;

  async function callAgent(userMessage){
    const context = buildContext();
    const body = {
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [
        { role:"user", content: `Current data:\n${JSON.stringify(context)}\n\nUser message: ${userMessage}` }
      ]
    };
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if(!textBlock) throw new Error('no response');
    let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    return JSON.parse(clean);
  }

  function applyActions(actions){
    let switchTo = null;
    (actions||[]).forEach(a=>{
      try{
        if(a.type==='add_task'){
          let catId = a.categoryId;
          if(!catId || !state.categories.find(c=>c.id===catId)){
            const cat = findOrCreateCategory(a.categoryName || state.categories[0].name);
            catId = cat.id;
          }
          addTask({categoryId:catId, title:a.title, notes:a.notes});
          switchTo = catId;
        }else if(a.type==='complete_task'){
          updateTask(a.id, {done:true, completedAt:Date.now()});
        }else if(a.type==='reopen_task'){
          updateTask(a.id, {done:false, completedAt:null});
        }else if(a.type==='update_notes'){
          updateTask(a.id, {notes:a.notes});
        }else if(a.type==='update_title'){
          updateTask(a.id, {title:a.title});
        }else if(a.type==='delete_task'){
          deleteTask(a.id);
        }else if(a.type==='add_category'){
          const cat = findOrCreateCategory(a.name);
          switchTo = switchTo || cat.id;
        }
      }catch(err){ console.error('action failed', a, err); }
    });
    if(switchTo) activeCategoryId = switchTo;
    saveState();
    render();
  }

  agentForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = agentInput.value.trim();
    if(!msg) return;
    addMsg(msg, 'user');
    agentInput.value = '';
    const thinking = addMsg('', 'thinking');
    try{
      const result = await callAgent(msg);
      thinking.remove();
      addMsg(result.reply || 'done.', 'agent');
      if(result.actions && result.actions.length) applyActions(result.actions);
    }catch(err){
      console.error(err);
      thinking.remove();
      addMsg('connection failed — try again in a moment.', 'agent error');
    }
  });

  // ---------- Init ----------
  (async function init(){
    state = await loadState();
    activeCategoryId = state.categories[0].id;
    render();
  })();
})();
</script>
</body>
</html>
