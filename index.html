<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>task.log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101215;
    --surface:#181b1f;
    --surface-2:#1f2329;
    --surface-3:#262b32;
    --border:#2a2e35;
    --text:#e9e7e2;
    --text-dim:#8b9099;
    --text-faint:#565b63;
    --accent-purple:#a879ff;
    --danger:#ff6b6b;
    --radius:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(168,121,255,0.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent-purple);outline-offset:2px;}
  ::selection{background:var(--accent-purple);color:#160c26;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

  #app{
    display:grid;
    grid-template-columns:240px 1fr;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    overflow-y:auto;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.01em;
    padding:4px 8px 22px 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand::before{
    content:'>';
    color:var(--accent-purple);
    font-family:var(--font-mono);
  }
  .brand::after{
    content:'';
    width:8px;height:16px;
    background:var(--accent-purple);
    animation:blink 1.1s step-end infinite;
    margin-left:1px;
  }
  @keyframes blink{ 50%{opacity:0;} }
  @media (prefers-reduced-motion: reduce){ .brand::after{animation:none;opacity:1;} }

  .nav-label{
    font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:0.06em;
    padding:14px 10px 6px 10px;
  }
  .nav-label:first-of-type{padding-top:0;}

  .cal-nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;
    background:transparent;border:none;border-left:3px solid transparent;
    color:var(--text-dim);padding:10px 10px;border-radius:0 6px 6px 0;
    font-size:14px;text-align:left;transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .cal-nav-btn .glyph{font-size:14px;flex-shrink:0;}
  .cal-nav-btn:hover{background:var(--surface-2);color:var(--text);}
  .cal-nav-btn.active{background:var(--surface-2);color:var(--text);border-left-color:var(--accent-purple);}

  .cat-list{display:flex;flex-direction:column;gap:2px;}
  .cat-tab{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--text-dim);
    padding:10px 10px;
    border-radius:0 6px 6px 0;
    font-size:14px;
    text-align:left;
    position:relative;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .cat-tab .dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 0 3px transparent;
    transition:box-shadow .15s ease;
  }
  .cat-tab .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .cat-tab .count{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
  }
  .cat-tab:hover{background:var(--surface-2);color:var(--text);}
  .cat-tab.active{
    background:var(--surface-2);
    color:var(--text);
    border-left-color:var(--cat-color, var(--accent-purple));
  }
  .cat-tab.active .dot{ box-shadow:0 0 0 3px color-mix(in srgb, var(--cat-color, var(--accent-purple)) 25%, transparent); }
  .cat-tab .del-cat{
    display:none;
    background:none;border:none;color:var(--text-faint);
    font-size:14px;padding:2px 4px;
  }
  .cat-tab:hover .del-cat{display:inline-block;}
  .cat-tab .del-cat:hover{color:var(--danger);}

  .add-cat-row{margin-top:10px;}
  .add-cat-btn{
    width:100%;
    background:transparent;
    border:1px dashed var(--border);
    color:var(--text-faint);
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    text-align:left;
  }
  .add-cat-btn:hover{border-color:var(--text-faint);color:var(--text-dim);}
  .add-cat-form{display:flex;gap:6px;margin-top:4px;}
  .add-cat-form input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:7px 8px;font-size:13px;
  }
  .add-cat-form button{
    background:var(--accent-purple);color:#160c26;border:none;
    border-radius:6px;padding:0 10px;font-size:13px;font-weight:600;
  }

  .sidebar-foot{
    margin-top:auto;padding-top:14px;border-top:1px solid var(--border);
    font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
  }

  /* ---------- Board ---------- */
  .board{
    display:flex;flex-direction:column;
    overflow:hidden;
    padding:28px 36px 0 36px;
  }
  .board-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
    flex-wrap:wrap;gap:10px;
  }
  .board-header h1{
    font-family:var(--font-display);
    font-size:24px;
    margin:0;
    display:flex;align-items:center;gap:10px;
  }
  .board-header h1 .dot{width:10px;height:10px;border-radius:50%;}
  .add-task-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    display:flex;align-items:center;gap:6px;
    transition:border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .add-task-btn:hover{
    border-color:var(--accent-purple);
    color:var(--accent-purple);
    box-shadow:0 0 0 3px rgba(168,121,255,0.12);
  }

  .board-scroll{flex:1;overflow-y:auto;padding-bottom:24px;}

  .empty-state{
    color:var(--text-faint);
    font-family:var(--font-mono);
    font-size:12.5px;
    padding:44px 20px;
    border:1px dashed var(--border);
    border-radius:var(--radius);
    text-align:center;
    line-height:1.6;
  }
  .empty-state .glyph{display:block;font-size:20px;margin-bottom:8px;color:var(--text-faint);}

  .task-row{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--cat-color, var(--border));
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:8px;
    transition:transform .15s ease, opacity .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .task-row:hover{
    background:var(--surface-2);
    cursor:pointer;
    transform:translateX(2px);
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .task-row.punching{transform:scale(0.98);opacity:0.5;}

  .checkbox{
    width:19px;height:19px;border-radius:5px;
    border:1.5px solid var(--text-faint);
    flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease;
  }
  .checkbox:hover{border-color:var(--accent-purple);}
  .checkbox.checked{background:var(--accent-purple);border-color:var(--accent-purple);transform:scale(1.08);}
  .checkbox svg{width:12px;height:12px;display:none;}
  .checkbox.checked svg{display:block;}

  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14.5px;font-weight:500;line-height:1.4;}
  .task-notes-preview{
    font-size:12.5px;color:var(--text-dim);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .task-meta{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;
  }
  .task-meta .overdue{color:var(--danger);}

  .done-drawer{margin-top:18px;border-top:1px solid var(--border);padding-top:10px;}
  .done-toggle{
    background:none;border:none;color:var(--text-faint);
    font-family:var(--font-mono);font-size:12px;
    display:flex;align-items:center;gap:6px;padding:6px 2px;
  }
  .done-toggle:hover{color:var(--text-dim);}
  .done-toggle .chev{transition:transform .15s ease;display:inline-block;}
  .done-toggle.open .chev{transform:rotate(90deg);}
  .done-list{margin-top:8px;}
  .task-row.done{opacity:0.55;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--text-dim);}

  /* ---------- Calendar ---------- */
  .calendar-nav{display:flex;align-items:center;gap:10px;}
  .calendar-nav button{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:6px;width:30px;height:30px;font-size:14px;
  }
  .calendar-nav button:hover{border-color:var(--accent-purple);color:var(--accent-purple);}
  .calendar-month-label{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);min-width:130px;text-align:center;}
  .calendar-today-btn{
    background:none;border:1px solid var(--border);color:var(--text-faint);
    border-radius:6px;padding:6px 10px;font-size:11.5px;font-family:var(--font-mono);
  }
  .calendar-today-btn:hover{color:var(--text-dim);border-color:var(--text-faint);}

  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding-bottom:24px;}
  .calendar-dow{
    font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
    text-align:left;padding:2px 4px 6px 4px;text-transform:uppercase;letter-spacing:0.04em;
  }
  .calendar-cell{
    background:var(--surface);border:1px solid var(--border);border-radius:8px;
    min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;
  }
  .calendar-cell.other-month{opacity:0.35;}
  .calendar-cell.today{border-color:var(--accent-purple);}
  .calendar-date{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
  .calendar-cell.today .calendar-date{color:var(--accent-purple);font-weight:600;}
  .cal-task{
    font-size:11px;padding:3px 6px;border-radius:5px;background:var(--surface-2);
    border-left:3px solid var(--cat-color, var(--border));
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  }
  .cal-task:hover{background:var(--surface-3);}
  .cal-task.done{opacity:0.5;text-decoration:line-through;}
  .cal-more{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);padding-left:2px;}

  @media (max-width:900px){
    .calendar-cell{min-height:64px;font-size:11px;}
    .cal-task{font-size:10px;}
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,9,11,0.65);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;width:100%;max-width:460px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    animation:modalIn .18s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes modalIn{ from{opacity:0;transform:translateY(6px) scale(0.98);} to{opacity:1;transform:none;} }
  .modal h3{margin:0 0 14px 0;font-family:var(--font-display);font-size:17px;display:flex;align-items:center;gap:8px;}
  .modal h3::before{content:'//';color:var(--accent-purple);font-family:var(--font-mono);font-size:14px;}
  .field-label{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;display:block;
  }
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  .modal input[type=text], .modal input[type=date], .modal textarea, .modal select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:10px 11px;font-size:14px;
    margin-bottom:14px;resize:vertical;
  }
  .modal input[type=date]{color-scheme:dark;}
  .modal textarea{min-height:90px;line-height:1.5;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
  .btn{border:none;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--accent-purple);color:#160c26;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}
  .btn-danger-text{background:none;border:none;color:var(--text-faint);font-size:12.5px;}
  .btn-danger-text:hover{color:var(--danger);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  @media (max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;}
    .sidebar{
      flex-direction:row;overflow-x:auto;overflow-y:hidden;
      padding:12px 12px;align-items:center;border-right:none;border-bottom:1px solid var(--border);
    }
    .brand{padding:4px 12px 4px 4px;}
    .nav-label{display:none;}
    .cal-nav-btn{border-left:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap;}
    .cal-nav-btn.active{border-bottom-color:var(--accent-purple);}
    .cat-list{flex-direction:row;}
    .cat-tab{border-left:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap;}
    .cat-tab.active{border-bottom-color:var(--cat-color,var(--accent-purple));}
    .add-cat-row{margin-top:0;margin-left:6px;}
    .sidebar-foot{display:none;}
    .board{padding:18px 16px 0 16px;}
  }
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">task.log</div>

    <div class="nav-label">views</div>
    <button class="cal-nav-btn" id="calendarNavBtn"><span class="glyph">▦</span><span>Calendar</span></button>

    <div class="nav-label">categories</div>
    <nav class="cat-list" id="catList"></nav>
    <div class="add-cat-row" id="addCatRow">
      <button class="add-cat-btn" id="addCatBtn">+ new category</button>
    </div>

    <div class="sidebar-foot">saved in this browser</div>
  </aside>

  <main class="board">
    <div id="boardArea"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h3 id="modalHeading">New task</h3>
    <label class="field-label">Title</label>
    <input type="text" id="modalTitle" placeholder="What needs doing?">
    <label class="field-label">Notes / details</label>
    <textarea id="modalNotes" placeholder="Links, context, deadlines, anything worth keeping..."></textarea>
    <div class="field-row">
      <div>
        <label class="field-label">Category</label>
        <select id="modalCategory"></select>
      </div>
      <div>
        <label class="field-label">Due date</label>
        <input type="date" id="modalDueDate">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger-text" id="modalDelete" hidden>delete task</button>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost" id="modalCancel" type="button" style="margin-right:8px;">cancel</button>
      <button class="btn btn-primary" id="modalSave" type="button">save</button>
    </div>
  </div>
</div>

<script>
(function(){
  const PALETTE = ['#ff8fa3','#7dc4ff','#5eead4','#ffb86b','#f6c453','#a3e635','#c792ea'];
  let state = null;
  let viewMode = 'board'; // 'board' | 'calendar'
  let activeCategoryId = null;
  let editingTaskId = null; // null = creating new
  let doneOpen = false;

  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth(); // 0-indexed

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function defaultState(){
    return {
      categories:[
        {id:'cat_personal', name:'Personal', color:'#ff8fa3'},
        {id:'cat_uni', name:'Uni', color:'#7dc4ff'},
        {id:'cat_side', name:'Side Projects', color:'#5eead4'}
      ],
      tasks:[]
    };
  }

  async function loadState(){
    try{
      if(window.storage){
        const res = await window.storage.get('todo-data', false);
        if(res && res.value){
          const parsed = JSON.parse(res.value);
          if(parsed && Array.isArray(parsed.categories)) return parsed;
        }
      }else{
        const raw = localStorage.getItem('todo-data');
        if(raw){
          const parsed = JSON.parse(raw);
          if(parsed && Array.isArray(parsed.categories)) return parsed;
        }
      }
    }catch(e){ /* no data yet */ }
    return defaultState();
  }

  async function saveState(){
    try{
      if(window.storage){ await window.storage.set('todo-data', JSON.stringify(state), false); }
      else{ localStorage.setItem('todo-data', JSON.stringify(state)); }
    }
    catch(e){ console.error('save failed', e); }
  }

  function fmtTime(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  function fmtDue(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  function isOverdue(t){
    if(!t.dueDate || t.done) return false;
    return t.dueDate < todayStr();
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  // ---------- Rendering ----------
  function render(){
    renderSidebar();
    if(viewMode === 'calendar') renderCalendar();
    else renderBoard();
  }

  function renderSidebar(){
    document.getElementById('calendarNavBtn').classList.toggle('active', viewMode==='calendar');
    const list = document.getElementById('catList');
    list.innerHTML = '';
    state.categories.forEach(cat=>{
      const activeCount = state.tasks.filter(t=>t.categoryId===cat.id && !t.done).length;
      const btn = document.createElement('button');
      btn.className = 'cat-tab' + (viewMode==='board' && cat.id===activeCategoryId ? ' active':'');
      btn.style.setProperty('--cat-color', cat.color);
      btn.innerHTML = `<span class="dot" style="background:${cat.color}"></span>
        <span class="name">${escapeHtml(cat.name)}</span>
        <span class="count">${activeCount}</span>
        <button class="del-cat" title="delete category">✕</button>`;
      btn.addEventListener('click', (e)=>{
        if(e.target.classList.contains('del-cat')){
          e.stopPropagation();
          deleteCategory(cat.id);
          return;
        }
        viewMode = 'board';
        activeCategoryId = cat.id;
        doneOpen = false;
        render();
      });
      list.appendChild(btn);
    });
  }

  // ---------- Board view ----------
  function renderBoard(){
    const cat = state.categories.find(c=>c.id===activeCategoryId) || state.categories[0];
    if(!cat) return;
    activeCategoryId = cat.id;

    const boardArea = document.getElementById('boardArea');
    boardArea.innerHTML = `
      <div class="board-header">
        <h1><span class="dot" style="background:${cat.color}"></span><span>${escapeHtml(cat.name)}</span></h1>
        <button class="add-task-btn" id="addTaskBtn">+ add task</button>
      </div>
      <div class="board-scroll">
        <div id="activeList"></div>
        <div class="done-drawer">
          <button class="done-toggle" id="doneToggle"><span class="chev">▸</span> done (<span id="doneCount">0</span>)</button>
          <div class="done-list" id="doneList" hidden></div>
        </div>
      </div>
    `;

    document.getElementById('addTaskBtn').addEventListener('click', ()=> openTaskModal(null));
    document.getElementById('doneToggle').addEventListener('click', ()=>{ doneOpen = !doneOpen; render(); });

    const active = state.tasks.filter(t=>t.categoryId===cat.id && !t.done)
      .sort((a,b)=>{
        if(a.dueDate && b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
        if(a.dueDate) return -1;
        if(b.dueDate) return 1;
        return b.createdAt - a.createdAt;
      });
    const done = state.tasks.filter(t=>t.categoryId===cat.id && t.done)
      .sort((a,b)=> (b.completedAt||0) - (a.completedAt||0));

    const activeList = document.getElementById('activeList');
    if(active.length===0){
      activeList.innerHTML = '<div class="empty-state"><span class="glyph">◌</span>nothing here yet — hit "+ add task"</div>';
    }else{
      active.forEach(t=> activeList.appendChild(renderTaskRow(t, false)));
    }

    document.getElementById('doneCount').textContent = done.length;
    const doneList = document.getElementById('doneList');
    done.forEach(t=> doneList.appendChild(renderTaskRow(t, true)));
    doneList.hidden = !doneOpen;
    document.getElementById('doneToggle').classList.toggle('open', doneOpen);
  }

  function renderTaskRow(t, isDone){
    const row = document.createElement('div');
    row.className = 'task-row' + (isDone ? ' done':'');
    const cat = state.categories.find(c=>c.id===t.categoryId);
    if(cat) row.style.setProperty('--cat-color', cat.color);

    let metaHtml = '';
    if(isDone){
      metaHtml = `<span>// done ${fmtTime(t.completedAt)}</span>`;
    }else if(t.dueDate){
      const overdueCls = isOverdue(t) ? ' overdue' : '';
      metaHtml = `<span class="${overdueCls}">${isOverdue(t) ? '// overdue — was due' : '// due'} ${fmtDue(t.dueDate)}</span>`;
    }else{
      metaHtml = `<span>// added ${fmtTime(t.createdAt)}</span>`;
    }

    row.innerHTML = `
      <button class="checkbox${isDone?' checked':''}" title="${isDone?'mark not done':'mark done'}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#160c26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="task-body">
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${t.notes ? `<div class="task-notes-preview">${escapeHtml(t.notes)}</div>` : ''}
        <div class="task-meta">${metaHtml}</div>
      </div>
    `;
    row.querySelector('.checkbox').addEventListener('click', (e)=>{
      e.stopPropagation();
      row.classList.add('punching');
      setTimeout(()=>{ toggleDone(t.id); }, 140);
    });
    row.addEventListener('click', ()=> openTaskModal(t.id));
    return row;
  }

  // ---------- Calendar view ----------
  function renderCalendar(){
    const boardArea = document.getElementById('boardArea');
    const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});

    boardArea.innerHTML = `
      <div class="board-header">
        <h1><span>Calendar</span></h1>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="add-task-btn" id="addTaskBtn">+ add task</button>
        </div>
      </div>
      <div class="board-header" style="margin-top:-8px;">
        <div class="calendar-nav">
          <button id="calPrev" title="previous month">‹</button>
          <span class="calendar-month-label">${monthLabel}</span>
          <button id="calNext" title="next month">›</button>
        </div>
        <button class="calendar-today-btn" id="calToday">today</button>
      </div>
      <div class="board-scroll">
        <div class="calendar-grid" id="calGrid"></div>
      </div>
    `;

    document.getElementById('addTaskBtn').addEventListener('click', ()=> openTaskModal(null));
    document.getElementById('calPrev').addEventListener('click', ()=>{
      calMonth--; if(calMonth<0){calMonth=11; calYear--;}
      render();
    });
    document.getElementById('calNext').addEventListener('click', ()=>{
      calMonth++; if(calMonth>11){calMonth=0; calYear++;}
      render();
    });
    document.getElementById('calToday').addEventListener('click', ()=>{
      calYear = today.getFullYear(); calMonth = today.getMonth();
      render();
    });

    const grid = document.getElementById('calGrid');
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{
      const el = document.createElement('div');
      el.className = 'calendar-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstOfMonth = new Date(calYear, calMonth, 1);
    const startOffset = firstOfMonth.getDay(); // 0=Sun
    const gridStart = new Date(calYear, calMonth, 1 - startOffset);

    const tasksByDate = {};
    state.tasks.forEach(t=>{
      if(!t.dueDate) return;
      (tasksByDate[t.dueDate] = tasksByDate[t.dueDate] || []).push(t);
    });

    for(let i=0;i<42;i++){
      const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      const dateStr = cellDate.getFullYear()+'-'+String(cellDate.getMonth()+1).padStart(2,'0')+'-'+String(cellDate.getDate()).padStart(2,'0');
      const isOtherMonth = cellDate.getMonth() !== calMonth;
      const isToday = dateStr === todayStr();

      const cell = document.createElement('div');
      cell.className = 'calendar-cell' + (isOtherMonth ? ' other-month':'') + (isToday ? ' today':'');

      const dateEl = document.createElement('div');
      dateEl.className = 'calendar-date';
      dateEl.textContent = cellDate.getDate();
      cell.appendChild(dateEl);

      const dayTasks = (tasksByDate[dateStr] || []).sort((a,b)=> (a.done?1:0) - (b.done?1:0));
      const shown = dayTasks.slice(0,3);
      shown.forEach(t=>{
        const cat = state.categories.find(c=>c.id===t.categoryId);
        const pill = document.createElement('div');
        pill.className = 'cal-task' + (t.done ? ' done':'');
        if(cat) pill.style.setProperty('--cat-color', cat.color);
        pill.textContent = t.title;
        pill.title = t.title;
        pill.addEventListener('click', ()=> openTaskModal(t.id));
        cell.appendChild(pill);
      });
      if(dayTasks.length > shown.length){
        const more = document.createElement('div');
        more.className = 'cal-more';
        more.textContent = '+' + (dayTasks.length - shown.length) + ' more';
        cell.appendChild(more);
      }

      grid.appendChild(cell);
    }
  }

  // ---------- Task actions ----------
  function toggleDone(id){
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return;
    t.done = !t.done;
    t.completedAt = t.done ? Date.now() : null;
    saveState();
    render();
  }

  function addTask({categoryId, title, notes, dueDate}){
    if(!title || !title.trim()) return null;
    const t = {
      id: uid('task'),
      categoryId: categoryId || activeCategoryId,
      title: title.trim(),
      notes: (notes||'').trim(),
      dueDate: dueDate || null,
      done:false,
      createdAt: Date.now(),
      completedAt: null
    };
    state.tasks.push(t);
    saveState();
    return t;
  }

  function updateTask(id, patch){
    const t = state.tasks.find(x=>x.id===id);
    if(!t) return null;
    Object.assign(t, patch);
    saveState();
    return t;
  }

  function deleteTask(id){
    state.tasks = state.tasks.filter(x=>x.id!==id);
    saveState();
  }

  function findOrCreateCategory(name){
    const existing = state.categories.find(c=> c.name.toLowerCase()===String(name).toLowerCase());
    if(existing) return existing;
    const color = PALETTE[state.categories.length % PALETTE.length];
    const cat = {id: uid('cat'), name: name.trim(), color};
    state.categories.push(cat);
    return cat;
  }

  function deleteCategory(id){
    if(state.categories.length<=1){ alert("you need at least one category."); return; }
    const cat = state.categories.find(c=>c.id===id);
    if(!confirm(`Delete "${cat.name}" and all its tasks?`)) return;
    state.categories = state.categories.filter(c=>c.id!==id);
    state.tasks = state.tasks.filter(t=>t.categoryId!==id);
    if(activeCategoryId===id) activeCategoryId = state.categories[0].id;
    saveState();
    render();
  }

  // ---------- Modal ----------
  function openTaskModal(id){
    editingTaskId = id || null;
    const overlay = document.getElementById('overlay');
    const catSelect = document.getElementById('modalCategory');
    catSelect.innerHTML = state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

    if(id){
      const t = state.tasks.find(x=>x.id===id);
      document.getElementById('modalHeading').textContent = 'Edit task';
      document.getElementById('modalTitle').value = t.title;
      document.getElementById('modalNotes').value = t.notes || '';
      document.getElementById('modalDueDate').value = t.dueDate || '';
      catSelect.value = t.categoryId;
      document.getElementById('modalDelete').hidden = false;
    }else{
      document.getElementById('modalHeading').textContent = 'New task';
      document.getElementById('modalTitle').value = '';
      document.getElementById('modalNotes').value = '';
      document.getElementById('modalDueDate').value = '';
      catSelect.value = activeCategoryId || state.categories[0].id;
      document.getElementById('modalDelete').hidden = true;
    }
    overlay.hidden = false;
    document.getElementById('modalTitle').focus();
  }

  function closeModal(){
    document.getElementById('overlay').hidden = true;
    editingTaskId = null;
  }

  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && !document.getElementById('overlay').hidden) closeModal();
  });

  document.getElementById('modalSave').addEventListener('click', ()=>{
    const title = document.getElementById('modalTitle').value.trim();
    const notes = document.getElementById('modalNotes').value.trim();
    const categoryId = document.getElementById('modalCategory').value;
    const dueDate = document.getElementById('modalDueDate').value || null;
    if(!title) return;
    if(editingTaskId){
      updateTask(editingTaskId, {title, notes, categoryId, dueDate});
    }else{
      addTask({title, notes, categoryId, dueDate});
    }
    closeModal();
    render();
  });

  document.getElementById('modalDelete').addEventListener('click', ()=>{
    if(editingTaskId && confirm('Delete this task?')){
      deleteTask(editingTaskId);
      closeModal();
      render();
    }
  });

  // ---------- Calendar nav button ----------
  document.getElementById('calendarNavBtn').addEventListener('click', ()=>{
    viewMode = 'calendar';
    render();
  });

  // ---------- Add category ----------
  const addCatRow = document.getElementById('addCatRow');

  function showAddCatButton(){
    addCatRow.innerHTML = '<button class="add-cat-btn" id="addCatBtn">+ new category</button>';
  }
  function showAddCatForm(){
    addCatRow.innerHTML = `<form class="add-cat-form" id="addCatForm">
      <input type="text" id="newCatName" placeholder="category name" autocomplete="off">
      <button type="submit">add</button>
    </form>`;
    document.getElementById('newCatName').focus();
  }
  addCatRow.addEventListener('click', (e)=>{
    if(e.target.id==='addCatBtn') showAddCatForm();
  });
  addCatRow.addEventListener('submit', (e)=>{
    if(e.target.id!=='addCatForm') return;
    e.preventDefault();
    const name = document.getElementById('newCatName').value.trim();
    if(name){
      const cat = findOrCreateCategory(name);
      viewMode = 'board';
      activeCategoryId = cat.id;
      saveState();
    }
    showAddCatButton();
    render();
  });

  // ---------- Init ----------
  (async function init(){
    state = await loadState();
    activeCategoryId = state.categories[0].id;
    render();
  })();
})();
</script>
</body>
</html>
